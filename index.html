<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduLabs: Empowering Modern Education</title>
<script>
/* Runs before first paint: mark JS on, restore saved theme + language (light and English by default) */
(function(){
  var r=document.documentElement; r.classList.add('js');
  function g(k,d){try{var v=localStorage.getItem('edulabs:'+k);return v?JSON.parse(v):d}catch(e){return d}}
  var l=g('lang','en');
  r.lang = l==='ar'?'ar':'en'; r.dir = l==='ar'?'rtl':'ltr';
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&family=Lalezar&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens: exact brand colors from the logo ---------- */
:root{
  --bg:#e9eee4;            /* light lime green */
  --green:#7ed957;         /* lime green, the logo's exact color */
  --ink:#000000;
  --surface:#f6f9f2; --soft:#d8e2d0;
  --text:#1c2418; --muted:#44523d; --green-text:#2b6416;
  --shadow:4px 4px 0 var(--ink);
  --display:'Caprasimo','Cooper Black',Georgia,serif;
  --brandfont:'Caprasimo','Cooper Black',Georgia,serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --dir:1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Dark mode is opt-in through the header toggle (own attribute, so the viewer's theme can't flip it) */
:root[dir="rtl"]{--dir:-1}
:root[lang="ar"]{
  --display:'Lalezar','Caprasimo',Georgia,serif;
  --body:'Cairo','Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* Blocks on the green fill keep black ink in both themes */
.on-green{--ink:#000;--text:#000;--muted:#1b3a10;--surface:#f6f9f2;--green-text:#1b3a10}
*,*::before,*::after{box-sizing:inherit}
html{font-size:clamp(16px,15px + .2vw,19px);-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);scroll-behavior:smooth}
html.intro-on{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:400 1.0625rem/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:opacity .18s ease}
body.lang-swap{opacity:0}
:root[lang="ar"] body{line-height:1.8}
[hidden]{display:none!important}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .35s,border-color .35s,color .35s,fill .35s,stroke .35s!important}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--ink);margin:0}
h1{font-size:clamp(2rem,5.4vw,3.4rem);line-height:1.08}
h2{font-size:clamp(2rem,5.2vw,3.2rem);line-height:1.08}
h3{font-size:1.55rem;line-height:1.15}
:root[lang="ar"] h1{line-height:1.25}
:root[lang="ar"] h2{line-height:1.3}
:root[lang="ar"] h3{line-height:1.3}
p{margin:0}
a{color:inherit}
.wrap{width:min(clamp(1120px,74vw,1440px),100% - clamp(2rem,5vw,4rem));margin-inline:auto}
.section{padding-block:clamp(3.5rem,8vw,6rem)}
.intro-p{max-width:58ch;margin-top:1rem;color:var(--muted);font-size:1.15rem}
:focus-visible{outline:3px solid var(--green-text);outline-offset:3px}
/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:700 1rem var(--body);text-decoration:none;
  padding:.7rem 1.3rem;border:2.5px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
:root[dir="rtl"] .btn:hover{transform:translate(1px,-1px);box-shadow:-4px 4px 0 var(--ink)}
:root[dir="rtl"] .btn{box-shadow:-3px 3px 0 var(--ink)}
:root[dir="rtl"] .btn:active{transform:translate(-2px,2px);box-shadow:-1px 1px 0 var(--ink)}
.btn-green{background:var(--green);color:#000}
.btn-sm{padding:.4rem .9rem;font-size:.92rem}
.pill{display:inline-block;font:700 .78rem/1 var(--body);padding:.28rem .6rem;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink);vertical-align:middle}
/* ---------- Header ---------- */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:2.5px solid var(--ink)}
.bar{display:flex;align-items:center;gap:1rem;padding-block:.65rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.brand-tree svg{width:34px;height:40px;display:block}
.word{font-family:var(--brandfont);font-size:1.7rem;color:var(--ink);line-height:1}
.ibtn{width:2.5rem;height:2.5rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:0;border-radius:50%;border:2.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;font:700 .95rem var(--body);transition:transform .2s}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:19px;height:19px;display:block;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hdr-actions{margin-inline-start:auto;display:flex;align-items:center;gap:.5rem}
.hdr-actions .btn{min-height:2.5rem;padding:.35rem 1.1rem;font-size:.95rem}
.ibtn.lang{width:auto;padding:0 .9rem;border-radius:999px}
.progress{position:absolute;inset-inline:0;bottom:-2.5px;height:2.5px;background:var(--green);transform:scaleX(0);transform-origin:0 50%}
:root[dir="rtl"] .progress{transform-origin:100% 50%}
@media (max-width:479px){
  .hdr-actions .btn{display:none}
}
/* ---------- Intro splash ---------- */
.intro,.curtain{display:none}
.js .intro,.js .curtain{position:fixed;inset:0;display:grid;place-items:center;transform:translate3d(0,0,0)}
.js .curtain{background:var(--green);z-index:199}
.js .intro{background:var(--bg);z-index:200;--st:55ms;cursor:pointer}
.intro-in{display:grid;justify-items:center;padding:1rem;transition:transform .45s ease,opacity .35s ease}
.intro-tree svg{width:min(52vw,230px);height:auto;display:block}
.intro-word{display:flex;margin-top:1.1rem;font:400 clamp(3.2rem,15vw,5.6rem)/1 var(--brandfont);color:var(--ink)}
.intro-word span{display:inline-block;opacity:0;transform:translate3d(0,50%,0) scale(.4) rotate(-8deg)}
.intro-tag{margin-top:.9rem;opacity:0;transform:translate3d(0,12px,0);font:400 1.15rem var(--display);color:var(--green-text);text-align:center}
.intro.go .intro-word span{animation:letter .65s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(1.1s + var(--i) * 70ms)}
.intro.go .intro-tag{animation:letter .6s ease-out 2s forwards}
.intro.leave{transform:translate3d(0,-101%,0);transition:transform .85s cubic-bezier(.75,0,.2,1);pointer-events:none}
.intro.leave .intro-in{transform:translate3d(0,-28px,0) scale(.96);opacity:0}
.curtain.leave{transform:translate3d(0,-101%,0);transition:transform .85s cubic-bezier(.75,0,.2,1) .12s;pointer-events:none}
@keyframes letter{to{opacity:1;transform:none}}
/* ---------- Tree mark ---------- */
.tree .n{fill:var(--green)}
.tree .e{stroke:var(--green);stroke-linecap:round;fill:none}
.tree.grow .e{stroke-dasharray:1;stroke-dashoffset:1}
.tree.grow .n{transform-box:view-box;transform:scale(0)}
.go .tree.grow .e,[data-s="in"] .tree.grow .e{animation:draw .55s ease-out forwards;animation-delay:calc(var(--i) * var(--st,45ms))}
.go .tree.grow .n,[data-s="in"] .tree.grow .n{animation:pop .6s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--i) * var(--st,45ms))}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
/* hard cartoon shadow on the logo, same idea as the buttons (flips in Arabic) */
.tree{filter:drop-shadow(calc(var(--dir) * 2px) 2px 0 var(--ink))}
.hero-art svg,.intro-tree svg{filter:drop-shadow(calc(var(--dir) * 6px) 6px 0 var(--ink))}
/* ---------- Scroll reveal system (transform + opacity only) ---------- */
.js [data-rv]{transition:opacity .7s ease,transform .85s cubic-bezier(.2,.9,.3,1.12),translate .25s ease,box-shadow .25s ease}
.js [data-rv="rise"],.js [data-rv="pop"],.js [data-rv="side"]{opacity:0}
.js [data-rv="rise"]{transform:translate3d(0,44px,0) scale(.97)}
.js [data-rv="pop"]{transform:translate3d(0,24px,0) scale(.82)}
.js [data-rv="side"]{transform:translate3d(calc(var(--dir) * -56px),0,0) scale(.97)}
.js [data-rv][data-s="in"]{opacity:1;transform:none;transition-delay:var(--d,0ms)}
.js [data-rv][data-s="up"]{opacity:0;transform:translate3d(0,-40px,0) scale(.97);transition-duration:.4s,.5s;transition-timing-function:ease}
/* word-by-word headings */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-block:.18em;margin-block:-.18em}
.wi{display:inline-block}
.js [data-rv="split"] .wi{transform:translate3d(0,120%,0);transition:transform .8s cubic-bezier(.2,.9,.2,1)}
.js [data-rv="split"][data-s="in"] .wi{transform:none;transition-delay:calc(var(--i) * 60ms + var(--d,0ms))}
.js [data-rv="split"][data-s="up"] .wi{transform:translate3d(0,-120%,0);transition-duration:.45s}
@media (hover:hover){
  .plan:hover,.tile:hover{translate:0 -6px}
}
/* ---------- Hero ---------- */
.hero{display:grid;gap:2.5rem;align-items:center;padding-block:clamp(2.5rem,7vw,5rem)}
@media (min-width:880px){
  .hero{grid-template-columns:1.1fr .9fr}
}
.lead{max-width:48ch;margin-top:1.4rem;font-size:1.2rem;color:var(--muted)}
.cta-row{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2rem}
.hero-art{position:relative;display:grid;justify-items:center;align-content:center;gap:.5rem;width:min(100%,440px);aspect-ratio:1;margin-inline:auto}
.hero-art>[data-tree]{width:48%}
.hero-art svg{width:100%;height:auto;display:block;animation:float 7s ease-in-out infinite}
.hero-art:not([data-s="in"]) svg{animation-play-state:paused}
@keyframes float{50%{transform:translate3d(0,-10px,0)}}
/* ---------- Services ---------- */
.svc{display:grid;gap:1.4rem;margin-top:2.5rem}
@media (min-width:900px){
  .svc{grid-template-columns:1fr}
}
.tile{border:2.5px solid var(--ink);border-radius:28px;padding:1.6rem;background:var(--surface);box-shadow:var(--shadow)}
.tile p{margin-top:.8rem;color:var(--muted)}
.tile.on-green{background:var(--green)}
.ticks{list-style:none;margin:1.4rem 0 0;padding:0;display:grid;gap:.65rem}
.ticks li{position:relative;padding-inline-start:2rem;font-weight:500}
.ticks li::before{content:"";position:absolute;inset-inline-start:0;top:.3em;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--bg);border:2.5px solid var(--ink)}
.tile.soon{background:transparent;border-style:dashed;box-shadow:none}
/* ---------- Steps ---------- */
.steps{list-style:none;margin:2.5rem 0 0;padding:0;display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));position:relative}
.steps li{display:grid;gap:.6rem;align-content:start}
.steps .num{position:relative;z-index:1;display:grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--green);color:#000;border:2.5px solid var(--ink);font:400 1.5rem var(--display)}
.steps h3{font-size:1.35rem}
.steps p{color:var(--muted)}
/* ---------- Plans ---------- */
.plans{display:grid;gap:1.4rem;margin-top:1.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));align-items:stretch}
.plan{display:flex;flex-direction:column;gap:.4rem;border:2.5px solid var(--ink);border-radius:28px;padding:1.6rem;background:var(--surface);box-shadow:var(--shadow)}
.plan.featured{background:var(--green)}
.plan .blurb{color:var(--muted)}
/* ---------- FAQ ---------- */
.faq{margin-top:2.25rem;max-width:760px;border-bottom:2.5px solid var(--ink)}
.faq details{border-top:2.5px solid var(--ink)}
.faq summary{cursor:pointer;list-style:none;padding:1.15rem 0;font:600 1.15rem var(--body);display:flex;justify-content:space-between;gap:1rem;color:var(--ink)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:400 1.6rem/1 var(--display);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding-bottom:1.2rem;max-width:62ch;color:var(--muted);animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* ---------- Band + footer ---------- */
.band{border:2.5px solid var(--ink);border-radius:36px;background:var(--green);padding:clamp(2rem,6vw,4rem);display:grid;gap:1.5rem;justify-items:start;box-shadow:var(--shadow)}
.band p{max-width:50ch;font-size:1.15rem;color:var(--text)}
.foot{border-top:2.5px solid var(--ink);padding-block:2.25rem;margin-top:clamp(3rem,7vw,5rem)}
.foot .wrap{display:flex;flex-wrap:wrap;gap:1.25rem 2.5rem;align-items:center;justify-content:space-between}
.foot nav{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem}
.foot small{color:var(--muted);display:block;width:100%}
/* ---------- Forms / dialogs ---------- */
dialog{padding:0;border:2.5px solid var(--ink);border-radius:28px;background:var(--surface);color:var(--text);width:min(480px,100% - 1.5rem);max-height:calc(100% - 2rem);max-height:calc(100dvh - 2rem);box-shadow:6px 6px 0 var(--ink)}
dialog[open]{animation:dlgIn .38s cubic-bezier(.2,.9,.3,1.2)}
dialog::backdrop{background:rgba(10,20,6,.55)}
dialog[open]::backdrop{animation:fadeIn .3s ease}
@keyframes dlgIn{from{opacity:0;transform:translate3d(0,26px,0) scale(.93)}to{opacity:1;transform:none}}
.dlg{padding:1.5rem}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.1rem}
.dlg-head h2{font-size:1.9rem}
.x{font:400 1.6rem/1 var(--display);width:2.4rem;height:2.4rem;border-radius:50%;border:2.5px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer;flex:none}
.dlg .btn{width:100%}
/* ---------- Request dialog ---------- */
dialog.req{width:min(540px,100% - 1.5rem);overflow:hidden}
dialog.req[open]{display:flex}
dialog.req .dlg{display:flex;flex-direction:column;width:100%;min-height:0}
.req-body{flex:1 1 auto;min-height:0;overflow-y:auto;margin-inline:-.4rem;padding:.1rem .4rem .35rem}
.req-foot{flex:none;padding-top:.9rem;border-top:2.5px solid var(--soft);margin-top:.2rem}
.lbl-short{display:none}
.hdr-actions .btn{white-space:nowrap}
.req-sub{margin:.35rem 0 0;color:var(--muted)}
.req-list{list-style:none;margin:0 0 .9rem;padding:0;display:grid;gap:.65rem}
.req-list li{display:grid;grid-template-columns:auto 1fr;gap:.85rem;align-items:center;padding:.7rem .95rem;border:2.5px solid var(--ink);border-radius:18px;background:var(--bg)}
.req-list .n{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--green);border:2.5px solid var(--ink);color:#000;font:400 1.1rem/1 var(--display)}
.req-list strong{display:block;color:var(--ink);line-height:1.3}
.req-list .d{display:block;color:var(--muted);font-size:.93rem;line-height:1.4;margin-top:.1rem}
.req-tip{margin:.6rem 0 0;color:var(--muted);font-size:.9rem;text-align:center}
.wa-ic{width:1.35rem;height:1.35rem;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:479px){
  .hdr-actions .btn{font-size:.92rem;padding:.35rem .9rem}
  .lbl-full{display:none}
  .lbl-short{display:inline}
  .req-list li{padding:.6rem .8rem;gap:.7rem}
}
@keyframes rise{from{opacity:0;transform:translate3d(0,26px,0) scale(.98)}to{opacity:1;transform:none}}
@keyframes menuIn{from{opacity:0;transform:translate3d(0,-10px,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .js [data-rv]{opacity:1!important;transform:none!important}
  .js [data-rv="split"] .wi{transform:none!important}
  .tree.grow .e{stroke-dashoffset:0!important}
  .tree.grow .n{transform:none!important}
  .js .intro,.js .curtain{display:none!important}
  .steps::before{transform:scaleX(1)!important}
}
.flist{list-style:none;margin:.6rem 0 1.5rem;padding:0;display:grid;gap:.75rem}
.flist li{display:grid;position:relative;padding-inline-start:1.7rem}
.flist li::before{content:"";position:absolute;inset-inline-start:0;top:.4em;width:.95rem;height:.95rem;border-radius:50%;border:2.5px solid var(--ink);background:var(--bg)}
.flist strong{color:var(--ink)}
.flist span{color:var(--muted);font-size:.95rem}
.ft-h{font-size:1.35rem;margin-top:.5rem}
.ft-h .pill{font-family:var(--body);margin-inline-start:.4rem;position:relative;top:-.12rem}
dialog.feat{width:min(560px,100% - 1.5rem)}
.ticks .linkbtn{margin-inline-start:.35rem}
.add-h{margin-top:2.5rem;font-size:1.6rem}
.add-h .pill{font-family:var(--body);margin-inline-start:.5rem;position:relative;top:-.15rem}
.add-p{margin-top:.5rem;color:var(--muted);max-width:60ch}
.wo{display:block;margin-top:.5rem;color:var(--muted);font-size:.9rem}
.hw{display:flex;margin-top:.6rem;font:400 clamp(2.4rem,9vw,3.8rem)/1 var(--brandfont);color:var(--ink)}
.hw span{display:inline-block;opacity:0;transform:translate3d(0,50%,0) scale(.4) rotate(-8deg)}
.hero-tag{text-align:center;font:400 1.1rem var(--display);color:var(--green-text);opacity:0;transform:translate3d(0,12px,0)}
.hero-art[data-s="in"] .hw span{animation:letter .65s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(1.1s + var(--i) * 70ms)}
.hero-art[data-s="in"] .hero-tag{animation:letter .6s ease-out 2s forwards}
@media (prefers-reduced-motion:reduce){.hw span,.hero-tag{opacity:1!important;transform:none!important}}
/* ---------- v3: trial badge + pop-up, animated routes, feature icons ---------- */
:root{--a:100%;--b:0}
:root[dir="rtl"]{--a:0;--b:100%}
@keyframes route{from{clip-path:inset(0 var(--a) 0 var(--b))}to{clip-path:inset(0 0 0 0)}}
@keyframes routeY{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes stepIn{from{opacity:0;transform:translateY(18px) scale(.92)}}
@keyframes numPop{from{transform:scale(0)}}
@keyframes wob{50%{rotate:-4deg}}
.band{position:relative}
.badge{position:absolute;z-index:2;top:-1.5rem;inset-inline-end:1.25rem;width:5.6rem;aspect-ratio:1;display:grid;place-content:center;text-align:center;border:2.5px solid #000;border-radius:50%;background:#f6f9f2;color:#000;box-shadow:calc(var(--dir)*3px) 3px 0 #000;rotate:8deg;font:400 1.05rem/1.05 var(--display);animation:wob 3.4s ease-in-out infinite}
.badge b{font-weight:400}.badge i{font-style:normal;line-height:.8}
@media(min-width:700px){.badge{width:7.4rem;font-size:1.35rem;top:-2rem;inset-inline-end:2.5rem}}
/* steps: each dotted segment draws after its node pops */
.steps li{position:relative}
.js .steps:not([data-s="in"]) li{opacity:0}
.js .steps[data-s="in"] li{animation:stepIn .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--k)*.6s + .1s)}
.js .steps[data-s="in"] .num{animation:numPop .5s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--k)*.6s + .2s)}
.steps li:not(:last-child)::after{content:"";position:absolute;pointer-events:none;top:1.55rem;inset-inline-start:3.2rem;width:calc(100% + 1.5rem - 3.2rem);height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 9px,transparent 9px 18px)}
.steps[data-s="in"] li:not(:last-child)::after{animation:var(--rk,route) .5s linear both;animation-delay:calc(var(--k)*.6s + .5s)}
@media(min-width:900px){.steps{grid-template-columns:repeat(4,1fr)}}
@media(max-width:899px){
 .steps{--rk:routeY;grid-template-columns:1fr;gap:2rem}
 .steps li{padding-inline-start:4.6rem;min-height:3.2rem}
 .steps .num{position:absolute;inset-inline-start:0;top:0}
 .steps li:not(:last-child)::after{top:3.2rem;inset-inline-start:calc(1.6rem - 1.5px);width:3px;height:calc(100% + 2rem - 3.2rem);background:repeating-linear-gradient(180deg,var(--ink) 0 9px,transparent 9px 18px)}
}
/* plans: card, dotted road, stop, next card */
.plans{--route:var(--ink);--pg:3.2rem;gap:var(--pg)}
@media(min-width:960px){.plans{--pg:4.4rem;grid-template-columns:repeat(3,1fr)}}
@media(max-width:959px){.plans{--rk:routeY;grid-template-columns:1fr;max-width:40rem}}
.plan{position:relative;transition:translate .25s ease}

function treeSVG(mode){
  const body = TREE.p.map(p => `<path class="n" d="${p[0]}" style="--i:${p[3]};transform-origin:${p[1]}px ${p[2]}px"/>`).join('');
  return `<svg class="tree ${mode==='grow'?'grow':''}" viewBox="0 0 ${TREE.w} ${TREE.h}" role="img" aria-label="EduLabs tree mark">${body}</svg>`;
}
$$('[data-tree]').forEach(el => { el.innerHTML = treeSVG(el.dataset.tree); });

/* ---------- helpers ---------- */
function splitWords(el){
  const words = el.textContent.trim().split(/\s+/);
  el.innerHTML = words.map((w,i) => `<span class="w"><span class="wi" style="--i:${i}">${esc(w)}</span></span>`).join(' ');
}

function renderSocial(){
  const list = [['instagram','soc.ig','instagram'],['tiktok','soc.tt','tiktok'],['channel','soc.ch','announcements']];
  const link = (k, lbl, ic, cls, sm) => `<a class="${cls}" data-soc="${k}" href="${SOCIAL[k]}" target="_blank" rel="noopener">${ico(ic, sm)}<span>${t(lbl)}</span></a>`;
  $('#socPage').innerHTML = list.map(([k,l,i]) => link(k,l,i,'btn','sm')).join('');
  $('#socFoot').innerHTML = list.map(([k,l,i]) => link(k,l,i,'','sm')).join('');
}
function renderFeats(){
  const wo = k => tx('f.'+k+'.w') ? `<small class="wo">${t('f.'+k+'.w')}</small>` : '';
  $('#addCards').innerHTML = FEATURES.addons.map(k => `<li class="bfi" data-rv="rise">${ico(k)}<div><strong>${t('f.'+k)}</strong><span>${t('f.'+k+'.d')}</span>${wo(k)}</div></li>`).join('');
  $('#baseCards').innerHTML = FEATURES.base.map(k => `<li class="bfi" data-rv="rise">${ico(k)}<div><strong>${t('f.'+k)}</strong><span>${t('f.'+k+'.d')}</span></div></li>`).join('');
}

/* ---------- language + theme ---------- */
function applyLang(){
  const root = document.documentElement;
  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $$('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (el.hasAttribute('data-i18n-html')) el.innerHTML = v; else el.textContent = v;
    if (el.hasAttribute('data-split')) splitWords(el);
  });
  $$('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  renderFeats(); renderSocial(); renderTrial(); renderWa();
  $('#langLbl').textContent = t('lang.btn');
  $('#langBtn').setAttribute('aria-label', t('lang.btn'));
  $('#langBtn').setAttribute('lang', lang === 'ar' ? 'en' : 'ar');
  observeAll();
}
function setLang(l){
  if (l === lang) return;
  const b = document.body;
  b.classList.add('lang-swap');
  setTimeout(() => {
    lang = l; store.set('lang', l); applyLang();
    requestAnimationFrame(() => b.classList.remove('lang-swap'));
  }, 190);
}

/* ---------- scroll reveal (IntersectionObserver, transform/opacity only) ---------- */
const seen = new WeakSet(); let io = null;
function setupIO(){
  if (reduce || !('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(entries => {
    const entering = entries.filter(e => e.isIntersecting)
      .sort((a,b) => (a.target.compareDocumentPosition(b.target) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);
    entering.forEach((en, i) => {            // items that arrive together cascade in
      const el = en.target;
      el.style.setProperty('--d', Math.min(i,5) * 90 + 'ms');
      el.dataset.s = 'in';
      setTimeout(() => el.style.removeProperty('--d'), 1600);
    });
    entries.forEach(en => {
      if (en.isIntersecting) return;
      const el = en.target;
      if (en.boundingClientRect.top < 0) el.dataset.s = 'up';   // scrolled past: exits upward
      else delete el.dataset.s;                                  // still below: waits, hidden
    });
  }, {threshold:.14, rootMargin:'0px 0px -6% 0px'});
}
function observeAll(){
  if (!ready) return;
  $$('[data-rv]').forEach(el => {
    if (seen.has(el)) return; seen.add(el);
    if (io) io.observe(el); else el.dataset.s = 'in';
  });
}

/* scroll progress bar (rAF throttled, transform only) */
(function(){
  const bar = $('#progress'); let tick = false;
  addEventListener('scroll', () => {
    if (tick) return; tick = true;
    requestAnimationFrame(() => {
      const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
      bar.style.transform = `scaleX(${max > 0 ? Math.min(1, Math.max(0, h.scrollTop / max)) : 0})`;
      tick = false;
    });
  }, {passive:true});
})();

/* ---------- routing ---------- */
function go(h){ if (location.hash === h) route(); else location.hash = h; }
function route(){
  const id = location.hash.replace(/^#\/?/, '');
  const el = id && document.getElementById(id);
  if (el) el.scrollIntoView(); else window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ---------- WhatsApp links (message is pre-filled in the current language) ---------- */
function renderWa(){
  const href = WHATSAPP + '?text=' + encodeURIComponent(t('wa.msg'));
  $$('[data-wa]').forEach(a => { a.href = href; });
}

/* ---------- request dialog ---------- */
const reqDlg = $('#reqDlg');
function startOrder(){ reqDlg.showModal(); }

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const el = e.target;
  if (el.closest('[data-order]')){ startOrder(); return; }
  if (el.closest('[data-close]')){ const d = el.closest('dialog'); d && d.close(); return; }
  if (el.tagName === 'DIALOG') el.close();
});
$('#langBtn').addEventListener('click', () => setLang(lang === 'ar' ? 'en' : 'ar'));

/* ---------- intro splash, then start the scroll reveals ---------- */
function startReveals(){ ready = true; setupIO(); observeAll(); }
function runIntro(){
  const intro = $('#intro'), curtain = $('#curtain'), root = document.documentElement;
  const deepLink = location.hash && location.hash !== '#/';
  if (reduce || deepLink){ intro.remove(); curtain.remove(); startReveals(); return; }
  root.classList.add('intro-on');
  let left = false;
  const leave = () => {
    if (left) return; left = true;
    intro.classList.add('leave'); curtain.classList.add('leave');
    root.classList.remove('intro-on');
    setTimeout(startReveals, 450);                    // hero builds in as the curtain lifts
    setTimeout(() => { intro.remove(); curtain.remove(); }, 1400);
  };
  const begin = () => {
    intro.classList.add('go');                        // tree grows, then the name pops in
    const timer = setTimeout(leave, 3100);
    intro.addEventListener('click', () => { clearTimeout(timer); leave(); });
  };
  const fontsReady = (document.fonts && document.fonts.load) ? document.fonts.load('400 1em Caprasimo') : Promise.resolve();
  Promise.race([fontsReady, new Promise(r => setTimeout(r, 1200))]).then(begin, begin);
}

$$('[data-ic]').forEach(el => { el.innerHTML = svgI(el.dataset.ic); });
const fmtShort = iso => new Date(iso+'T12:00:00').toLocaleDateString(lang==='ar'?'ar-EG-u-nu-latn':'en-US',{month:'short',day:'numeric'});
function renderTrial(){

/* ---------- start ---------- */
